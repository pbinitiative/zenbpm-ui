name: Playwright Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1-5'
      timezone: 'Europe/Prague'
  workflow_run:
    workflows: [release-dev]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: playwright-live
  cancel-in-progress: false

jobs:
  test:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'schedule' ||
        github.event.workflow_run.conclusion == 'success'
      }}
    timeout-minutes: 60
    runs-on: [self-hosted, linux, x64, vpn]
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate live test target
        shell: bash
        run: |
          case "${E2E_BASE_URL:-}" in
            http://ui-dev.zen|http://ui-dev.zen/) ;;
            '')
              echo "::error::Configure the E2E_BASE_URL repository variable before running live Playwright tests."
              exit 1
              ;;
            *)
              echo "::error::E2E_BASE_URL must be http://ui-dev.zen."
              exit 1
              ;;
          esac

      - name: Wait for live test target
        shell: bash
        run: |
          if ! getent hosts ui-dev.zen >/dev/null; then
            echo "::error::The VPN runner cannot resolve ui-dev.zen. Check its VPN DNS configuration."
            exit 1
          fi

          status_url="${E2E_BASE_URL%/}/system/status"
          deadline=$((SECONDS + 300))
          attempt=1
          while (( SECONDS < deadline )); do
            if curl --fail --silent --show-error --max-time 10 "${status_url}" >/dev/null; then
              echo "Live test target is ready."
              exit 0
            fi

            echo "Target not ready (attempt ${attempt}); retrying in 10 seconds."
            attempt=$((attempt + 1))
            sleep 10
          done

          echo "::error::The live test target did not become ready within 5 minutes."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium

      - name: Run live Playwright tests
        id: playwright_tests
        run: pnpm test:e2e:live

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-report
          path: playwright-report/
          retention-days: 30

      - name: Notify Discord with Playwright test result
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_QA_WEBHOOK_URL }}
          TEST_RESULT: ${{ steps.playwright_tests.outcome || 'skipped' }}
          TESTED_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_QA_WEBHOOK_URL is not configured; skipping Discord notification."
            exit 0
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          short_sha="${TESTED_SHA:0:7}"

          case "$TEST_RESULT" in
            success)
              result_text='passed'
              result_icon=':white_check_mark:'
              ;;
            failure)
              result_text='failed'
              result_icon=':x:'
              ;;
            cancelled)
              result_text='were cancelled'
              result_icon=':warning:'
              ;;
            skipped)
              result_text='did not run'
              result_icon=':warning:'
              ;;
            *)
              result_text="$TEST_RESULT"
              result_icon=':warning:'
              ;;
          esac

          message=$(printf '%s **ZenBPM UI live Playwright tests %s**\nBranch: `%s`\nCommit: `%s`\nRun details and HTML report: %s' \
            "$result_icon" \
            "$result_text" \
            "$TESTED_BRANCH" \
            "$short_sha" \
            "$run_url")
          payload=$(node -e 'process.stdout.write(JSON.stringify({ content: process.argv[1] }))' "$message")

          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
